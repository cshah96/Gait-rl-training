# =============================================================================
# DEP-RL gait IMITATION config: H2190 (90 muscles) scaled to Camargo subject AB07,
# tracking AB07's treadmill gait at 1.2 m/s (data/mimic/AB07/AB07_reference.npz).
#   Env    : scone_mimic.SconeMimicGym  (id sconemimic_h2190-v1), see docs/IMITATION_TRAINING.md
#   Agent  : MPO + DEP exploration (same as the H2190 walking config), plain replay buffer
#            (the reward already contains an effort term, so no AdaptiveEnergyBuffer)
#   Output : results/deprl/sconemimic_h2190_ab07/<date>.<model>/checkpoints/step_*.pt
# Train  : python scripts/deprl_train.py configs/deprl/sconemimic_h2190_ab07.yaml
#          or ./scripts/train_mimic.sh  (detached, 1e8 steps)
# =============================================================================
tonic:
  after_training: ''
  header: "import deprl, gym, sconegym, scone_mimic"
  agent: "deprl.custom_agents.dep_factory(3, deprl.custom_mpo_torch.TunedMPO())(replay=deprl.replays.buffers.Buffer(return_steps=1,
    batch_size=256, steps_between_batches=1000, batch_iterations=30, steps_before_batches=2e5))"
  before_training: ''
  checkpoint: "last"
  environment: "deprl.environments.Gym('sconemimic_h2190-v1', scaled_actions=False, reference='data/mimic/AB07/AB07_reference.npz')"
  full_save: 1
  name: "sconemimic_h2190_ab07"
  resume: true
  seed: 0
  parallel: 15
  sequential: 13
  test_environment: null
  trainer: "deprl.custom_trainer.Trainer(steps=int(1e8), epoch_steps=int(2e5), save_steps=int(2e7))"

working_dir: "IGNORED_FOR_HYFYDY"

# set as attributes on the env (override scone_mimic.env.DEFAULT_MIMIC_ARGS)
env_args:
  step_size: 0.025              # control step 25 ms (40 Hz)
  max_episode_steps: 300        # 7.5 s episodes
  # tracking reward weights / sharpness (Choi et al. 2026 + GRF term)
  w_pos: 0.25
  w_vel: 0.10
  w_root: 0.15
  w_ee: 0.25
  w_torque: 0.25
  w_grf: 0.10
  w_effort: 0.05
  w_smooth: 0.1                 # paper: 1.0 (SAC); DEP exploration is much jerkier
  min_reward: 0.0               # clip step reward >= 0 (no incentive to fall early)
  k_pos: 2.0
  k_vel: 0.05
  k_root: 500.0
  k_ee: 80.0
  k_torque: 2.0
  k_grf: 5.0
  subtalar_weight: 0.2
  max_root_dev: 0.4
  init_pos_noise: 0.02
  init_vel_noise: 0.05

mpo_args:
  hidden_size: 1024
  lr_actor: 3.53e-05
  lr_critic: 6.081e-05
  lr_dual: 0.00213

DEP:
  bias_rate: 0.002
  buffer_size: 200
  intervention_length: 8
  intervention_proba: 0.00371
  kappa: 1000
  normalization: "independent"
  q_norm_selector: "l2"
  regularization: 32
  s4avg: 2
  sensor_delay: 1
  tau: 40
  test_episode_every: 3
  time_dist: 5
  with_learning: true
