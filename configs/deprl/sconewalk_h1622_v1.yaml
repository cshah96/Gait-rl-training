# =============================================================================
# DEP-RL training config for sconegym `sconewalk_h1622-v1`
#   Model : H1622 (3-D, 22 muscles), Hyfydy engine
# Generated from configs/deprl/sconewalk_h0918_v1.yaml with the model-specific
# changes of upstream third_party/depRL/experiments/hyfydy/scone_walk_h1622.yaml:
#   environment id, experiment name, AdaptiveEnergyBuffer num_acts (= number of muscles)
# Same worker layout as the H0918 config (15 x 13 envs). NOT yet run on this machine.
# =============================================================================
tonic:
  after_training: ''
  header: "import deprl, gym, sconegym"
  # MPO (Maximum a-posteriori Policy Optimisation) agent wrapped with DEP
  # (Differential Extrinsic Plasticity) exploration. dep_factory(3, ...) selects
  # the DEP/MPO switching scheme used in the DEP-RL paper (Schumacher et al.
  # ICLR 2023). The AdaptiveEnergyBuffer relabels sampled rewards with an
  # adaptive muscle-effort cost  r' = r - c * sum(act^3); c is increased once the
  # average episode return exceeds 1000 and decreased otherwise.
  agent: "deprl.custom_agents.dep_factory(3, deprl.custom_mpo_torch.TunedMPO())(replay=deprl.custom_replay_buffers.AdaptiveEnergyBuffer(return_steps=1,
    batch_size=256, steps_between_batches=1000, batch_iterations=30, steps_before_batches=2e5,
    num_acts=22))"
  before_training: ''
  checkpoint: "last"
  environment: "deprl.environments.Gym('sconewalk_h1622-v1', scaled_actions=False)"
  full_save: 1          # 1 = also save replay buffer + optimiser (needed to resume)
  name: "sconewalk_h1622_v1"
  resume: true          # if a run with this name exists, continue the newest one
  seed: 0
  parallel: 15          # number of worker processes
  sequential: 13        # environments per worker process
  test_environment: null
  # 5e8 total env steps, logging/test every 2e5 steps, checkpoint every 1e6 steps
  # (~every 6.5 min at the measured ~2,600 steps/s -> 500 checkpoints in a full run)
  trainer: "deprl.custom_trainer.Trainer(steps=int(5e8), epoch_steps=int(2e5), save_steps=int(1e6))"

working_dir: "IGNORED_FOR_HYFYDY"   # sconegym envs always save via the SCONE results dir (symlinked into the repo)

# These are set as attributes on the sconegym GaitGym env (overriding the
# defaults that sconegym registers for sconewalk_h1622-v1).
env_args:
  clip_actions: true            # muscle excitations clipped to [0, 0.5]
  grf_coeff: -0.17281           # penalty for ground reaction force > 1.2 BW
  joint_limit_coeff: -0.1307    # penalty for joint-limit torques
  nmuscle_coeff: -1.57929       # penalty for fraction of muscles with act > 0.15
  smooth_coeff: -0.097          # penalty for change in excitation (smoothness)
  vel_coeff: 10                 # reward for COM velocity (gaussian plateau @ 1.2 m/s)
  step_size: 0.025              # control step = 25 ms (40 Hz)
  init_activations_mean: 0.01
  init_activations_std: 0       # if 0: deterministic initial activations

# DEP exploration hyper-parameters (see DEP-RL paper, appendix)
DEP:
  bias_rate: 0.002
  buffer_size: 200
  intervention_length: 8
  intervention_proba: 0.00371
  kappa: 1000
  normalization: "independent"
  q_norm_selector: "l2"
  regularization: 32
  s4avg: 2
  sensor_delay: 1
  tau: 40
  test_episode_every: 3
  time_dist: 5
  with_learning: true
